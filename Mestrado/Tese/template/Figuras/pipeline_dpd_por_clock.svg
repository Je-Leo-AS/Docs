<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="960" viewBox="0 0 1900 960">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111"/>
    </marker>
    <style>
      .title { font: 700 29px sans-serif; fill: #111; text-anchor: middle; }
      .head { font: 700 19px sans-serif; fill: #111; text-anchor: middle; }
      .compact { font: 700 16px sans-serif; fill: #111; text-anchor: middle; }
      .text { font: 17px sans-serif; fill: #111; text-anchor: middle; }
      .small { font: 15px sans-serif; fill: #222; text-anchor: middle; }
      .tiny { font: 13px sans-serif; fill: #222; text-anchor: middle; }
      .math { font: italic 18px serif; fill: #111; text-anchor: middle; }
      .cycle { font: 700 18px sans-serif; fill: #111; text-anchor: middle; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.2; }
      .reg { fill: #f2f2f2; stroke: #111; stroke-width: 2; }
      .line { fill: none; stroke: #111; stroke-width: 2.2; marker-end: url(#arrow); }
      .clock { fill: none; stroke: #111; stroke-width: 2; }
      .dash { fill: none; stroke: #555; stroke-width: 1.6; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1900" height="960" fill="#fff"/>
  <text x="950" y="42" class="title">Fluxo temporal da arquitetura VHDL do DPD</text>
  <text x="950" y="73" class="small">Uma amostra acompanhada da entrada à saída; cada fronteira vertical corresponde a uma borda de subida do clock</text>

  <!-- Clock waveform -->
  <text x="55" y="125" class="head">clk</text>
  <path d="M95 130 H125 V103 H155 V130 H245 V103 H275 V130 H365 V103 H395 V130 H485 V103 H515 V130 H605 V103 H635 V130 H725 V103 H755 V130 H845 V103 H875 V130 H965 V103 H995 V130 H1085 V103 H1115 V130 H1205 V103 H1235 V130 H1325 V103 H1355 V130 H1445 V103 H1475 V130 H1565 V103 H1595 V130 H1685 V103 H1715 V130 H1805" class="clock"/>

  <!-- cycle labels and register boundaries -->
  <g>
    <text x="140" y="169" class="cycle">C1</text><line x1="140" y1="177" x2="140" y2="718" class="dash"/>
    <text x="290" y="169" class="cycle">C2</text><line x1="290" y1="177" x2="290" y2="718" class="dash"/>
    <text x="440" y="169" class="cycle">C3</text><line x1="440" y1="177" x2="440" y2="718" class="dash"/>
    <text x="590" y="169" class="cycle">C4</text><line x1="590" y1="177" x2="590" y2="718" class="dash"/>
    <text x="740" y="169" class="cycle">C5</text><line x1="740" y1="177" x2="740" y2="718" class="dash"/>
    <text x="890" y="169" class="cycle">C6</text><line x1="890" y1="177" x2="890" y2="718" class="dash"/>
    <text x="1040" y="169" class="cycle">C7</text><line x1="1040" y1="177" x2="1040" y2="718" class="dash"/>
    <text x="1190" y="169" class="cycle">C8</text><line x1="1190" y1="177" x2="1190" y2="718" class="dash"/>
    <text x="1340" y="169" class="cycle">C9</text><line x1="1340" y1="177" x2="1340" y2="718" class="dash"/>
    <text x="1490" y="169" class="cycle">C10</text><line x1="1490" y1="177" x2="1490" y2="718" class="dash"/>
    <text x="1640" y="169" class="cycle">C11</text><line x1="1640" y1="177" x2="1640" y2="718" class="dash"/>
  </g>

  <!-- Main registered path -->
  <text x="42" y="286" class="math">UR, UI</text>
  <path d="M77 280 H91" class="line"/>

  <rect x="92" y="210" width="120" height="140" class="box"/>
  <text x="152" y="238" class="head">Linha de</text><text x="152" y="261" class="head">atrasos</text>
  <text x="152" y="293" class="math">x[n-m]</text>
  <text x="152" y="321" class="small">delay_line</text>
  <path d="M212 280 H232" class="line"/>

  <rect x="232" y="210" width="120" height="140" class="box"/>
  <text x="292" y="238" class="head">Potência</text>
  <text x="292" y="269" class="math">rₘ=Re²+Im²</text>
  <text x="292" y="298" class="small">base_vec</text>
  <text x="292" y="321" class="small">msq_vec</text>
  <path d="M352 280 H382" class="line"/>

  <rect x="382" y="210" width="120" height="140" class="box"/>
  <text x="442" y="238" class="compact">Termo linear</text>
  <text x="442" y="271" class="math">Tₘ,₀=x[n-m]</text>
  <text x="442" y="306" class="small">term_pipe(0)</text>
  <path d="M502 280 H532" class="line"/>

  <rect x="532" y="210" width="120" height="140" class="box"/>
  <text x="592" y="238" class="head">Ordem 1</text>
  <text x="592" y="271" class="math">Tₘ,₁=Tₘ,₀rₘ</text>
  <text x="592" y="306" class="small">term_pipe(1)</text>
  <path d="M652 280 H682" class="line"/>

  <rect x="682" y="210" width="120" height="140" class="box"/>
  <text x="742" y="238" class="head">Ordem 2</text>
  <text x="742" y="271" class="math">Tₘ,₂=Tₘ,₁rₘ</text>
  <text x="742" y="306" class="small">term_pipe(2)</text>
  <path d="M802 280 H832" class="line"/>

  <rect x="832" y="210" width="120" height="140" class="box"/>
  <text x="892" y="238" class="head">Ordem 3</text>
  <text x="892" y="271" class="math">Tₘ,₃=Tₘ,₂rₘ</text>
  <text x="892" y="306" class="small">term_pipe(3)</text>
  <path d="M952 280 H982" class="line"/>

  <rect x="982" y="210" width="120" height="140" class="box"/>
  <text x="1042" y="238" class="head">Ordem 4</text>
  <text x="1042" y="271" class="math">Tₘ,₄=Tₘ,₃rₘ</text>
  <text x="1042" y="306" class="small">term_pipe(4)</text>

  <!-- temporal alignment shown as overlapping path -->
  <path d="M442 350 V436 H1142" class="line"/>
  <path d="M592 350 V414 H1142" class="line"/>
  <path d="M742 350 V392 H1142" class="line"/>
  <path d="M892 350 V370 H1142" class="line"/>
  <path d="M1102 280 H1142" class="line"/>

  <rect x="1142" y="210" width="120" height="250" class="box"/>
  <text x="1202" y="240" class="head">Alinhamento</text>
  <text x="1202" y="266" class="head">temporal</text>
  <text x="1202" y="302" class="small">Tₘ,₀: 4 atrasos</text>
  <text x="1202" y="330" class="small">Tₘ,₁: 3 atrasos</text>
  <text x="1202" y="358" class="small">Tₘ,₂: 2 atrasos</text>
  <text x="1202" y="386" class="small">Tₘ,₃: 1 atraso</text>
  <text x="1202" y="414" class="small">Tₘ,₄: 0 atrasos</text>
  <text x="1202" y="444" class="small">align_pipe</text>
  <path d="M1262 335 H1282" class="line"/>

  <rect x="1282" y="250" width="120" height="170" class="box"/>
  <text x="1342" y="279" class="compact">Seleção e</text>
  <text x="1342" y="303" class="compact">empacotamento</text>
  <text x="1342" y="338" class="math">XX(0…8)</text>
  <text x="1342" y="373" class="small">pack_xx</text>
  <path d="M1402 335 H1432" class="line"/>

  <rect x="1432" y="250" width="120" height="170" class="box"/>
  <text x="1492" y="280" class="compact">Produtos</text>
  <text x="1492" y="304" class="compact">complexos</text>
  <text x="1492" y="339" class="math">cₖ × XX(k)</text>
  <text x="1492" y="374" class="small">9 em paralelo</text>
  <path d="M1552 335 H1572" class="line"/>

  <rect x="1572" y="210" width="140" height="250" class="box"/>
  <text x="1642" y="239" class="compact">Árvore de soma</text>
  <text x="1642" y="270" class="small">9 → 5 → 3 → 2 → 1</text>
  <text x="1642" y="301" class="small">4 níveis</text>
  <text x="1642" y="330" class="small">combinacionais</text>
  <line x1="1596" y1="357" x2="1688" y2="357" class="clock"/>
  <text x="1642" y="389" class="head">Saturação</text>
  <text x="1642" y="416" class="small">registro UR_out</text>
  <text x="1642" y="439" class="small">registro UI_out</text>
  <path d="M1712 335 H1760" class="line"/>
  <text x="1810" y="329" class="math">y[n]</text>
  <text x="1810" y="354" class="small">UR_out, UI_out</text>

  <!-- stage explanations -->
  <rect x="92" y="520" width="120" height="150" class="reg"/>
  <text x="152" y="550" class="head">C1</text><text x="152" y="580" class="small">converte UR/UI</text><text x="152" y="605" class="small">e desloca</text><text x="152" y="630" class="small">x[n-m]</text>
  <rect x="232" y="520" width="120" height="150" class="reg"/>
  <text x="292" y="550" class="head">C2</text><text x="292" y="580" class="small">calcula |x|²</text><text x="292" y="605" class="small">e registra</text><text x="292" y="630" class="small">base/potência</text>
  <rect x="382" y="520" width="720" height="150" class="reg"/>
  <text x="742" y="550" class="head">C3 a C7: geração recursiva em pipeline</text>
  <text x="742" y="584" class="math">Tₘ,ₚ = Tₘ,ₚ₋₁ · |x[n-m]|²</text>
  <text x="742" y="615" class="small">Cada estágio acrescenta uma potência par da magnitude.</text>
  <text x="742" y="641" class="small">Simultaneamente, amostras consecutivas ocupam estágios diferentes.</text>
  <rect x="1142" y="520" width="120" height="150" class="reg"/>
  <text x="1202" y="550" class="head">C4 a C8</text><text x="1202" y="580" class="small">alinha ordens</text><text x="1202" y="605" class="small">geradas em</text><text x="1202" y="630" class="small">ciclos distintos</text>
  <rect x="1282" y="520" width="120" height="150" class="reg"/>
  <text x="1342" y="550" class="head">C9</text><text x="1342" y="580" class="small">seleciona termos</text><text x="1342" y="605" class="small">de P=(5,3,1)</text><text x="1342" y="630" class="small">e registra XX</text>
  <rect x="1432" y="520" width="120" height="150" class="reg"/>
  <text x="1492" y="550" class="head">C10</text><text x="1492" y="580" class="tiny">multiplica pelos</text><text x="1492" y="605" class="tiny">coeficientes e</text><text x="1492" y="630" class="tiny">registra produtos</text>
  <rect x="1572" y="520" width="140" height="150" class="reg"/>
  <text x="1642" y="550" class="head">C10 → C11</text><text x="1642" y="580" class="tiny">soma combinacional;</text><text x="1642" y="605" class="tiny">satura e registra</text><text x="1642" y="630" class="tiny">a saída em C11</text>

  <!-- throughput strip -->
  <rect x="92" y="760" width="1620" height="120" class="box"/>
  <text x="902" y="795" class="head">O pipeline processa várias amostras simultaneamente</text>
  <text x="902" y="829" class="text">Latência da amostra ilustrada: da captura em C1 ao registro da saída em C11</text>
  <text x="902" y="858" class="text">Vazão em regime permanente: 1 amostra complexa por ciclo de clock</text>

  <text x="950" y="925" class="small">Os blocos cinza representam operações registradas; a árvore de soma é combinacional entre os registros de C10 e C11.</text>
</svg>
